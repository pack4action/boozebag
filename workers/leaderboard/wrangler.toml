name = "boozebag-leaderboard"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Every Worker gets a free address at <name>.<account>.workers.dev, and
# that is all the site needs: the page is told where it is with one tag in
# its head (see README). Once boozebag.xyz is bought and on Cloudflare,
# uncomment the routes below and the Worker answers on the domain too, at
# /api/, the same origin as the page.
workers_dev = true
# routes = [
#   { pattern = "boozebag.xyz/api/*", zone_name = "boozebag.xyz" },
#   { pattern = "www.boozebag.xyz/api/*", zone_name = "boozebag.xyz" }
# ]

[[d1_databases]]
binding = "DB"
database_name = "boozebag"
# Filled in by `wrangler d1 create boozebag` -- see README.
database_id = "PUT-THE-DATABASE-ID-HERE"
