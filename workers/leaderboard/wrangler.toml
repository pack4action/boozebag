name = "boozebag-leaderboard"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Served from the site's own domain, so the page and the board are the same
# origin and the browser never has to be told it is allowed to ask.
routes = [
  { pattern = "boozebag.xyz/api/*", zone_name = "boozebag.xyz" },
  { pattern = "www.boozebag.xyz/api/*", zone_name = "boozebag.xyz" }
]

[[d1_databases]]
binding = "DB"
database_name = "boozebag"
# Filled in by `wrangler d1 create boozebag` -- see README.
database_id = "PUT-THE-DATABASE-ID-HERE"
