name = "boozebag-leaderboard"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Every Worker gets a free address at <name>.<account>.workers.dev, and
# that is all the site needs: the page is told where it is with one tag in
# its head (see README). Once boozebag.us has its DNS on Cloudflare,
# uncomment the routes below and the Worker answers on the domain too, at
# /api/, the same origin as the page. Not before: a route naming a zone
# Cloudflare does not hold yet fails the deploy.
workers_dev = true
# routes = [
#   { pattern = "boozebag.us/api/*", zone_name = "boozebag.us" },
#   { pattern = "www.boozebag.us/api/*", zone_name = "boozebag.us" }
# ]

[[d1_databases]]
binding = "DB"
database_name = "boozebag"
# Filled in by `wrangler d1 create boozebag` -- see README.
database_id = "5395e5be-720e-4d0f-adea-61d506e0b15a"
