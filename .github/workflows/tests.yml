name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Only Chromium: the render test drives one browser, and the plan
      # tests need none at all.
      - run: npx playwright install --with-deps chromium
      - run: npm test
